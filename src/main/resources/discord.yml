role-permissions:
  # Example: Discord role ID -> LuckPerms permission/group
  "1000000000000000000": "admin"
  "2000000000000000000": "co-owner"
  "3000000000000000000": "owner"


nickname:
  enabled: true
  format: "{username} | {minecraft_name}"

settings:
  # Send join/leave messages to Discord
  join-leave-messages: true

  # Enable chat relay between Discord and Minecraft
  chat-relay: true

  # Auto-sync roles when player joins
  auto-sync-roles: true

  # Sync bans between Discord and Minecraft
  sync-bans: true

  # Enable role change notifications
  role-change-notifications: true

  # Sync roles between Discord and Minecraft
  sync-roles: true

  # Verified role when player verifies its get the role in discord
  verify-roleID: 0000000000000000000

# Advanced Settings
advanced:
  # Debug mode (enables verbose logging)
  debug: false

  # Allow players to use Discord commands in game
  allow-discord-commands: false
